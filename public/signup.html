<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Artovex - Sign Up</title>
  <link rel="stylesheet" href="./assets/css/style.css" />
</head>
<body class="bg-dark">

  <main>
   <section class="auth-wrapper">
  <div class="auth-card">
    <h2 style="text-align:center; margin-bottom: 20px;">Create Your Account</h2>

    <form action="/signup" method="post">
      <input type="text" name="name" class="auth-input" placeholder="Name" required>
      <input type="email" name="email" class="auth-input" placeholder="Email" required>
      <input type="password" name="password" class="auth-input" placeholder="Password" required>

      <button type="submit" class="btn btn-primary auth-btn">Sign Up</button>
    </form>

    <p class="auth-footer">
      Already have an account?
      <a href="/login">Login</a>
    </p>
  </div>
</section>

  </main>

</body>
</html>
