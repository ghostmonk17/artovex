<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Artovex Dashboard - Upload Artworks</title>

  <link rel="stylesheet" href="./assets/css/style.css" />

  <!-- Google Fonts (same as index) -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Catamaran:wght@600;700;800;900&family=Rubik:wght@400;500;800&display=swap"
    rel="stylesheet">
</head>

<body class="bg-dark">

  <main>
    <section class="section" style="min-height: 100vh;">
      <div class="container">

        <!-- Top bar -->
        <header style="display:flex; justify-content:space-between; align-items:center; margin-bottom: 1.5rem;">
          <div>
            <h1 class="h2 section-title" style="color:#fff;">Artovex Dashboard</h1>
            <p class="section-text">
              Upload new artworks and manage the gallery content.
            </p>
          </div>
          <a href="/logout" class="btn btn-secondary">Logout</a>
        </header>

        <!-- Upload Form -->
        <div style="background:#ffffff; padding:24px; border-radius:16px; margin-bottom: 2rem;">
          <h2 class="h3" style="margin-bottom: 1rem;">Upload New Artwork</h2>

          <form id="upload-form" enctype="multipart/form-data">
            <div class="input-wrapper" style="margin-bottom: 12px;">
              <label for="title" class="h4" style="margin-bottom:6px; display:block;">Title</label>
              <input type="text" id="title" name="title" class="contact-input" placeholder="Artwork title" required />
            </div>

            <div class="input-wrapper" style="margin-bottom: 12px;">
              <label for="description" class="h4" style="margin-bottom:6px; display:block;">Description</label>
              <textarea id="description" name="description" class="contact-input" rows="4" placeholder="Short description"></textarea>
            </div>

            <div class="input-wrapper" style="margin-bottom: 12px;">
              <label for="category" class="h4" style="margin-bottom:6px; display:block;">Category (optional)</label>
              <input type="text" id="category" name="category" class="contact-input" placeholder="Painting, Digital, Photography, etc." />
            </div>

            <div class="input-wrapper" style="margin-bottom: 12px;">
              <label for="image" class="h4" style="margin-bottom:6px; display:block;">Artwork Image</label>
              <input type="file" id="image" name="image" accept="image/*" required />
            </div>

            <button type="submit" class="btn btn-primary" style="margin-top: 8px;">
              Upload Artwork
            </button>

            <p id="upload-status" class="section-text" style="margin-top: 0.75rem;"></p>
          </form>
        </div>

        <!-- Existing artworks (admin view) -->
        <div style="background:#ffffff; padding:24px; border-radius:16px;">
          <h2 class="h3" style="margin-bottom: 1rem;">Current Gallery Artworks</h2>
          <div id="artwork-list"
               style="display:grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap:16px;">
            <!-- Filled by JS -->
          </div>
        </div>

      </div>
    </section>
  </main>

  <script>
    // Load artworks for admin view
    async function loadArtworksAdmin() {
      const container = document.getElementById("artwork-list");
      if (!container) return;

      try {
        const res = await fetch("/api/artworks");
        if (!res.ok) throw new Error("Failed to load artworks");

        const artworks = await res.json();
        container.innerHTML = "";

        if (!artworks.length) {
          container.innerHTML = "<p>No artworks yet.</p>";
          return;
        }

        artworks.forEach((art) => {
          const div = document.createElement("div");
          div.style.border = "1px solid #eee";
          div.style.borderRadius = "12px";
          div.style.overflow = "hidden";
          div.style.background = "#fafafa";

          div.innerHTML = `
            <div style="width:100%; height:180px; overflow:hidden;">
              <img src="${art.fileUrl}" alt="${art.title || "Artwork"}"
                   style="width:100%; height:100%; object-fit:cover;" />
            </div>
            <div style="padding:8px 10px 12px;">
              <h3 style="font-size:1rem; font-weight:600; margin-bottom:4px;">
                ${art.title || "Untitled"}
              </h3>
              <p style="font-size:0.85rem; max-height:60px; overflow:hidden;">
                ${art.description || ""}
              </p>
              <p style="font-size:0.75rem; opacity:0.7; margin-top:4px;">
                ${art.category || ""}
              </p>
            </div>
          `;

          container.appendChild(div);
        });
      } catch (err) {
        console.error(err);
        container.innerHTML = "<p style='color:red;'>Failed to load artworks.</p>";
      }
    }

    // Handle upload form submit
    const uploadForm = document.getElementById("upload-form");
    const uploadStatus = document.getElementById("upload-status");

    if (uploadForm) {
      uploadForm.addEventListener("submit", async (e) => {
        e.preventDefault();
        uploadStatus.textContent = "Uploading...";

        const formData = new FormData(uploadForm);

        try {
          const res = await fetch("/api/upload", {
            method: "POST",
            body: formData,
          });

          if (!res.ok) throw new Error("Upload failed");

          const data = await res.json();

          if (data.success) {
            uploadStatus.textContent = "Artwork uploaded successfully!";
            uploadForm.reset();
            loadArtworksAdmin(); // Refresh list
          } else {
            uploadStatus.textContent = "Upload failed. Please try again.";
          }
        } catch (err) {
          console.error(err);
          uploadStatus.textContent = "Error uploading artwork.";
        }
      });
    }

    // Initial load
    window.addEventListener("DOMContentLoaded", loadArtworksAdmin);
  </script>
</body>
</html>
